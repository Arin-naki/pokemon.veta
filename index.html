  <style>:root {
  --ink: #17201c;
  --ink-soft: #3e4943;
  --muted: #707a74;
  --muted-light: #98a09b;
  --line: #dfe3de;
  --line-soft: #eceeea;
  --paper: #fffef9;
  --sidebar: #f1f1ea;
  --panel: #ffffff;
  --panel-soft: #f5f3ed;
  --coral: #e45c51;
  --coral-soft: #fff0eb;
  --green: #2f5b49;
  --shadow: 0 14px 35px rgba(35, 52, 43, .09);
  --text-micro: 8px;
  --text-caption: 10px;
  --text-body: 12px;
  --text-reading: 14px;
  --text-title: 16px;
  --text-section: 18px;
  --text-emphasis: 22px;
  --weight-info-chip: 700;
  --weight-chip-helper: 600;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); background: var(--paper); font-family: Pretendard, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: var(--text-body); }
button, input { font: inherit; }
select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid rgba(47,91,73,.28); outline-offset: 2px; }
.expand-chevron { display: block; flex: 0 0 auto; width: 16px; height: 16px; color: var(--muted-light); transform-origin: center; transition: transform .18s ease; }
details[open] > summary .expand-chevron, [aria-expanded='true'] .expand-chevron { transform: rotate(180deg); }
button:disabled { cursor: not-allowed; opacity: .35; }
img { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.gender-symbol { display: inline-block; margin-left: .04em; font-family: Arial, Helvetica, sans-serif; font-size: .78em; font-style: normal; font-weight: 800; font-variant-emoji: text; line-height: 1; letter-spacing: 0; vertical-align: .14em; }
.hero-copy h1 .gender-symbol { margin-left: .06em; font-size: .62em; vertical-align: .26em; }

.app-shell { --index-width: 254px; width: 100%; height: 100dvh; overflow: hidden; background: var(--paper); }
.topbar { position: relative; z-index: 30; display: grid; grid-template-areas: 'brand search spacer data'; grid-template-columns: var(--index-width) minmax(0,520px) minmax(0,1fr) auto; align-items: center; min-height: 76px; padding: 14px 22px 14px 0; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); backdrop-filter: blur(16px); }
.brand { grid-area: brand; display: flex; min-width: 0; align-items: center; gap: 7px; overflow: hidden; padding: 0 0 0 22px; border: 0; text-align: left; white-space: nowrap; font-weight: 800; letter-spacing: -.035em; background: transparent; cursor: pointer; }
.brand-title { flex: 0 0 auto; font-size: var(--text-reading); }
.veta-credit { flex: 0 0 auto; margin-left: 1px; color: #aeb3af; font: 650 6px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.035em; }
.veta-credit b { color: #c77d76; font-weight: 800; }
.header-version { grid-area: data; display: inline-flex; min-height: 28px; align-items: center; justify-content: center; justify-self: end; margin-left: 18px; padding: 0 10px; border: 1px solid #edccc6; border-radius: 999px; color: #ae5b53; background: #fff8f5; font: 750 var(--text-caption)/1 ui-monospace, monospace; white-space: nowrap; }
.brand-ball { position: relative; display: inline-block; flex: 0 0 auto; width: 25px; height: 25px; overflow: hidden; border: 3px solid var(--ink); border-radius: 50%; background: linear-gradient(var(--coral) 0 45%,var(--ink) 45% 55%,#fff 55%); }
.brand-ball::after { position: absolute; inset: 7px; content: ''; border: 2px solid var(--ink); border-radius: 50%; background: #fff; }
.search-area { position: relative; grid-area: search; min-width: 0; width: calc(100% - 12px); margin-left: 12px; }
.search-box, .move-search-box { display: flex; min-width: 0; align-items: center; gap: 8px; margin: 0; padding: 9px 12px; border: 1px solid #d5dad5; border-radius: 12px; color: var(--muted); background: #fff; transition: border-color .18s, box-shadow .18s; }
.search-box { position: relative; width: 100%; }
.search-box:focus-within, .move-search-box:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,91,73,.08); }
.search-icon { display: block; flex: 0 0 auto; width: 17px; height: 17px; color: var(--muted); }
.search-box input, .move-search-box input { width: 100%; min-width: 0; padding: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: var(--text-reading); }
.search-box input { padding-right: 28px; }
.move-search-box { min-height: 38px; }
.move-search-box input { font-size: var(--text-body); }
.search-box input::placeholder, .move-search-box input::placeholder { color: #9ca39f; }
.search-clear { position: absolute; top: 50%; right: 7px; display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; padding: 0; transform: translateY(-50%); border: 0; border-radius: 50%; color: var(--muted); background: #f2f3ef; cursor: pointer; font-size: var(--text-title); line-height: 1; }
.search-results { position: absolute; z-index: 60; top: calc(100% + 7px); left: 0; width: 100%; overflow: hidden; border: 1px solid #d8ddd9; border-radius: 14px; background: #fff; box-shadow: 0 18px 46px rgba(31,42,35,.2); }
.search-results-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px 9px; border-bottom: 1px solid var(--line-soft); }
.search-results-heading b { font-size: var(--text-body); }
.search-results-heading span { color: var(--muted); white-space: nowrap; font-size: var(--text-caption); }
.search-result-list { max-height: min(424px,calc(100dvh - 96px)); overflow-y: auto; overscroll-behavior: contain; }
.search-result-row { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; width: 100%; min-height: 52px; padding: 6px 12px; border: 0; border-bottom: 1px solid var(--line-soft); text-align: left; background: transparent; cursor: pointer; }
.search-result-row:hover { background: var(--panel-soft); }
.search-result-row:last-child { border-bottom: 0; }
.search-result-number { color: #8b938e; font: 600 var(--text-caption)/1 ui-monospace,monospace; }
.search-result-name { min-width: 0; }
.search-result-name b, .search-result-name small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-result-name b { font-size: var(--text-body); }
.search-result-name small { margin-top: 2px; color: var(--muted); font-size: var(--text-caption); }
.search-result-types { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
.search-result-types .type-badge { padding: 4px 6px; font-size: var(--text-micro); }
.search-result-empty { padding: 28px 12px; color: var(--muted); text-align: center; font-size: var(--text-caption); }
.mobile-list-toggle { display: none; border: 0; background: transparent; }
.content-grid { display: grid; grid-template-columns: var(--index-width) minmax(0,1fr); height: calc(100dvh - 76px); }
.pokemon-index { --index-gutter: 12px; display: flex; min-height: 0; flex-direction: column; border-right: 1px solid var(--line); background: var(--sidebar); }
.index-heading { display: flex; align-items: end; justify-content: space-between; padding: 16px var(--index-gutter) 9px; }
.index-heading strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-title); letter-spacing: -.025em; }
.index-heading span { color: var(--muted); font-size: var(--text-body); }
.index-mode { display: grid; grid-template-columns: 1fr 1fr; margin: 0 var(--index-gutter) 9px; padding: 3px; border-radius: 10px; background: rgba(218,222,216,.72); }
.index-mode button { min-height: 34px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; cursor: pointer; font-size: var(--text-caption); font-weight: 750; }
.index-mode button[aria-pressed='true'] { color: var(--green); background: #fff; box-shadow: 0 2px 7px rgba(42,63,52,.08); }
.regional-index-panel { display: grid; gap: 8px; margin: 0 var(--index-gutter) 9px; padding: 10px; border: 1px solid rgba(194,200,195,.86); border-radius: 11px; background: rgba(255,255,255,.68); }
.regional-index-field { display: grid; gap: 5px; min-width: 0; }
.regional-index-field > span { color: var(--muted); font-size: var(--text-caption); font-weight: 750; }
.regional-index-field select { width: 100%; min-width: 0; padding: 7px 48px 7px 8px; border: 1px solid #d5dad5; border-radius: 8px; outline: 0; color: var(--ink); background-color: #fff; font-size: var(--text-caption); }
.regional-index-field select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,91,73,.08); }
.pokemon-list { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--index-gutter) 8px; scrollbar-color: #c4cac5 transparent; scrollbar-width: thin; }
.pokemon-row { display: grid; grid-template-columns: 46px 44px minmax(0,1fr); align-items: center; width: 100%; min-height: 46px; padding: 3px 6px; border: 0; border-bottom: 1px solid rgba(154,164,158,.22); text-align: left; background: transparent; cursor: pointer; transition: background .15s, box-shadow .15s; }
.pokemon-row:hover { background: rgba(255,255,255,.58); }
.pokemon-row.selected { border-bottom-color: transparent; border-radius: 10px; background: #fff; box-shadow: inset 3px 0 0 var(--coral), 0 4px 14px rgba(42,63,52,.08); }
.row-number { color: #8b938e; font: 600 var(--text-caption)/1 ui-monospace, monospace; }
.pokemon-row img { width: 40px; height: 40px; object-fit: contain; image-rendering: auto; }
.row-name { min-width: 0; padding-left: 2px; }
.row-name b, .row-name small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-name b { font-size: var(--text-body); }
.row-name small { margin-top: 1px; color: #8a928e; font-size: var(--text-caption); }
.index-footer { display: flex; justify-content: space-between; padding: 10px var(--index-gutter); border-top: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.36); font-size: var(--text-caption); }

.pokemon-detail { min-width: 0; overflow-x: hidden; overflow-y: scroll; overscroll-behavior: contain; scrollbar-gutter: stable; background: radial-gradient(circle 280px at 91% 80px,rgba(240,105,88,.12),transparent 70%),var(--paper); }
.detail-inner { position: relative; width: min(980px, 100%); min-height: 100%; margin: 0 auto; padding: 19px 30px 60px; }
.detail-inner::before { position: absolute; z-index: 0; top: -130px; right: -95px; width: 390px; height: 390px; content: ''; pointer-events: none; border: 1px solid rgba(224,85,71,.13); border-radius: 50%; box-shadow: inset 0 0 0 55px var(--paper),inset 0 0 0 56px rgba(224,85,71,.09); }
.detail-nav { position: relative; z-index: 2; display: flex; justify-content: space-between; }
.detail-nav button { padding: 5px 0; border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: var(--text-body); }
.detail-nav button:hover:not(:disabled) { color: var(--ink); }
.detail-hero { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0,1fr) 210px; align-items: center; min-height: 202px; }
.detail-number { display: flex; max-width: 560px; flex-wrap: wrap; gap: 0 10px; color: var(--coral); font: 800 var(--text-body)/1.45 ui-monospace, monospace; letter-spacing: .08em; }
.dex-number-group { white-space: nowrap; }
.hero-copy h1 { margin: 12px 0 5px; font-size: clamp(38px,5vw,54px); line-height: .95; letter-spacing: -.075em; }
.hero-copy > p { margin: 0; color: var(--muted); font-size: var(--text-reading); }
.type-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
.type-badge, .status-tag { display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px; border-radius: 999px; color: #fff; font-size: var(--text-caption); font-weight: 800; white-space: nowrap; }
.status-tag { color: #844b13; background: #f8dfa8; }
.type-normal { background:#878773 }.type-fighting { background:#ad374b }.type-flying { background:#756fb9 }.type-poison { background:#87509e }.type-ground { background:#ae7543 }.type-rock { background:#967e3e }.type-bug { background:#738f31 }.type-ghost { background:#655d93 }.type-steel { background:#637b87 }.type-fire { background:#df5d3f }.type-water { background:#3875ad }.type-grass { background:#4d8d4a }.type-electric { background:#bd8412 }.type-psychic { background:#d65475 }.type-ice { background:#378d96 }.type-dragon { background:#554cc3 }.type-dark { background:#554c49 }.type-fairy { background:#bc6d9c }.type-unknown { background:#69736d }
.hero-image { position: relative; align-self: end; display: grid; grid-template-rows: 174px 29px; width: 210px; min-height: 203px; justify-items: center; }
.hero-image > img { align-self: center; width: 190px; height: 174px; object-fit: contain; filter: drop-shadow(0 17px 18px rgba(68,41,38,.17)); }
.hero-image > img.pixel-sprite { width: 148px; height: 148px; image-rendering: pixelated; }
.hero-image > div { display: flex; margin-top: -3px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.84); }
.hero-image button { padding: 4px 7px; border: 0; border-radius: 5px; color: var(--muted); background: transparent; cursor: pointer; font-size: var(--text-caption); }
.hero-image button.active { color: #fff; background: var(--green); }
.form-selector { position: relative; z-index: 2; margin: 12px 0 14px; padding: 12px 14px; border: 1px solid #e5e6df; border-radius: 15px; background: rgba(255,255,255,.82); box-shadow: 0 7px 22px rgba(42,55,48,.035); }
.form-selector-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 9px; }
.form-selector-heading b { display: block; margin-top: 3px; font-size: var(--text-reading); }
.form-selector-heading > small { color: var(--muted); text-align: right; font-size: var(--text-caption); }
.form-option-list { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 6px; }
.form-option-list button { display: grid; grid-template-columns: 39px minmax(0,1fr); align-items: center; min-width: 0; padding: 5px 8px; border: 1px solid var(--line-soft); border-radius: 10px; text-align: left; background: var(--panel-soft); cursor: pointer; }
.form-option-list button:hover { border-color: #c7cec8; background: #fff; }
.form-option-list button.active { border-color: var(--green); background: #edf5f0; box-shadow: inset 3px 0 0 var(--green); }
.form-option-list img { width: 35px; height: 35px; object-fit: contain; }
.form-option-list span { min-width: 0; }
.form-option-list b, .form-option-list small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.form-option-list b { font-size: var(--text-caption); }
.form-option-list small { margin-top: 3px; color: var(--muted-light); font-size: var(--text-micro); }
.form-select-large { display: grid; grid-template-columns: 48px minmax(0,1fr); align-items: center; gap: 10px; }
.form-select-large > img { width: 46px; height: 46px; object-fit: contain; }
.form-select-large label span { display: block; margin-bottom: 4px; color: var(--muted-light); font-size: var(--text-micro); }
.form-select-large select { width: 100%; padding: 8px 32px 8px 10px; border: 1px solid var(--line); border-radius: 9px; outline: 0; color: var(--ink); background: #fff; font-size: var(--text-caption); }
.form-select-large select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,91,73,.08); }
.form-applicability { display: grid; grid-template-columns: 86px minmax(0,1fr); align-items: center; gap: 6px 10px; margin-top: 9px; padding: 9px 10px; border: 1px solid #ead9b7; border-radius: 9px; background: #fffaf0; }
.form-applicability > b { color: #765d2b; font-size: var(--text-caption); }
.form-applicability > div { display: flex; flex-wrap: wrap; gap: 5px; }
.form-applicability > div span { padding: 4px 6px; border-radius: 6px; color: #765521; background: #f4e5bd; font-size: var(--text-micro); font-weight: var(--weight-info-chip); }
.form-applicability > small { grid-column: 2; color: var(--muted); font-size: var(--text-micro); line-height: 1.45; }
.detail-tabs { position: sticky; z-index: 10; top: 0; display: flex; gap: 25px; margin: 0 0 20px; border-bottom: 1px solid #e4e5df; background: rgba(255,254,249,.94); backdrop-filter: blur(12px); }
.detail-tabs button { display: flex; align-items: center; gap: 5px; padding: 12px 0 10px; border: 0; border-bottom: 3px solid transparent; color: #78817c; background: transparent; cursor: pointer; font-size: var(--text-body); font-weight: 750; white-space: nowrap; }
.detail-tabs button[aria-selected='true'] { border-bottom-color: transparent; color: var(--ink); }
.detail-tabs .detail-tab-label { position: relative; }

.detail-tabs small { display: inline-flex; flex: 0 0 26px; width: 26px; min-width: 26px; height: 12px; align-items: center; justify-content: center; box-sizing: border-box; padding: 2px 4px; border-radius: 999px; color: #8b6a63; background: var(--coral-soft); font-family: inherit; font-size: var(--text-micro); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }

.tab-content { position: relative; z-index: 1; min-width: 0; width: 100%; min-height: max(360px,calc(100dvh - 150px)); }
.tab-content > *, .tab-stack, .detail-section { min-width: 0; width: 100%; max-width: 100%; }
.tab-stack { display: grid; gap: 12px; }
.detail-section { padding: 20px; border: 1px solid #e8e7e1; border-radius: 18px; background: rgba(255,255,255,.85); box-shadow: 0 7px 24px rgba(42,55,48,.035); }
.section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 16px; }

.section-heading > small { color: var(--muted); font-size: var(--text-caption); }
.section-heading .selected-form-caption { display: block; margin-top: 5px; color: var(--muted); font-size: var(--text-caption); font-weight: 600; }
.section-kicker { color: var(--coral); font: 700 var(--text-caption)/1.2 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; }
.overview-copy > p { max-width: 760px; margin: 0 0 18px; color: var(--ink-soft); font-size: var(--text-reading); line-height: 1.78; word-break: keep-all; }
.flavor-entry-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-bottom: 18px; }
.flavor-entry-card { min-width: 0; padding: 12px; border: 1px solid var(--line-soft); border-radius: 12px; background: #fbfaf6; }
.flavor-entry-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.flavor-entry-head > div { display: flex; flex-wrap: wrap; gap: 5px; }
.flavor-game, .flavor-form { display: inline-flex; padding: 4px 6px; border-radius: 6px; font-size: var(--text-micro); font-weight: var(--weight-info-chip); }
.flavor-game { color: #fff; background: var(--green); }
.flavor-scarlet { background: #c54e46; }
.flavor-violet { background: #6752a4; }
.flavor-legends-arceus { background: #4f776c; }
.flavor-legends-za { background: #52636d; }
.flavor-form { color: #725d30; background: #f1e7ca; }
.flavor-entry-head a { flex: 0 0 auto; color: var(--muted); font-size: var(--text-micro); font-weight: 700; text-decoration: none; }

.form-outcome-block { margin-top: 12px; padding: 12px; border: 1px solid #dce7df; border-radius: 12px; background: #f5faf7; }
.form-outcome-block > div:first-child { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; }
.form-outcome-block b { color: #285f46; font-size: var(--text-caption); }
.form-outcome-block p { margin: 0; color: var(--ink-soft); font-size: var(--text-caption); font-weight: 700; }
.outcome-form-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.outcome-form-list span { padding: 5px 7px; border-radius: 7px; color: #285f46; background: #e5f1e9; font-size: var(--text-micro); font-weight: var(--weight-info-chip); }
.presence-tags span, .presence-status-row-tags b, .presence-status-row-tags em, .ability-name-line > span, .version-difference, .rule-default, .rule-alternative, .outcome-form-list span { display: inline-flex; min-height: 18px; align-items: center; padding-block: 5px; line-height: 1; }
.outcome-form-more { margin-top: 7px; }
.outcome-form-more summary { display: inline-flex; align-items: center; gap: 4px; color: var(--green); list-style: none; cursor: pointer; font-size: var(--text-micro); font-weight: 750; }
.outcome-form-more summary .expand-chevron { width: 12px; height: 12px; color: currentColor; }
.lifecycle-list { display: grid; gap: 6px; margin-top: 11px; }
.lifecycle-list > div { display: grid; grid-template-columns: 68px minmax(0,1fr); gap: 4px 8px; padding: 9px 10px; border-radius: 9px; background: #fff7ed; }
.lifecycle-list b { color: #8a5c25; font-size: var(--text-micro); }
.lifecycle-list span { color: var(--ink-soft); font-size: var(--text-caption); font-weight: 700; }
.lifecycle-list small { grid-column: 2; color: var(--muted); font-size: var(--text-micro); line-height: 1.5; }
.rule-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; color: var(--muted); font-size: var(--text-caption); }
.rule-meta span { padding: 5px 7px; border-radius: 6px; background: var(--panel-soft); font-weight: var(--weight-info-chip); }
.requirements-list { display: grid; grid-template-columns: repeat(auto-fit,minmax(145px,1fr)); gap: 6px; margin: 13px 0 0; }
.requirements-list > div { min-width: 0; padding: 9px 10px; border-radius: 9px; background: var(--panel-soft); }
.requirements-list dt { margin-bottom: 4px; color: var(--muted-light); font-size: var(--text-micro); }
.requirements-list dd { margin: 0; overflow-wrap: anywhere; font-size: var(--text-caption); font-weight: 700; }
.empty-evolution { padding: 50px 20px; text-align: center; }
.empty-evolution > span { color: var(--coral); font: 700 var(--text-caption)/1 ui-monospace,monospace; letter-spacing: .1em; }
.empty-evolution h2 { margin: 8px 0; font-size: var(--text-emphasis); }
.empty-evolution p { margin: 0; color: var(--muted); font-size: var(--text-body); }

.loading-screen, .error-screen { display: grid; min-height: 100dvh; place-content: center; justify-items: center; padding: 24px; text-align: center; background: var(--paper); }
.loading-screen .brand-ball { width: 44px; height: 44px; animation: ball-turn 1.2s ease-in-out infinite; }
.loading-screen .brand-ball::after { inset: 12px; }
.loading-screen h1, .error-screen h1 { margin: 18px 0 6px; font-size: var(--text-emphasis); letter-spacing: -.04em; }
.loading-screen p, .error-screen p { margin: 0; color: var(--muted); font-size: var(--text-body); }
.loading-screen > i { width: 180px; height: 4px; margin-top: 19px; overflow: hidden; border-radius: 99px; background: #e7eae6; }
.loading-screen > i::after { display: block; width: 45%; height: 100%; content: ''; border-radius: inherit; background: var(--green); animation: loader 1.1s ease-in-out infinite alternate; }
.error-screen button { margin-top: 18px; padding: 8px 12px; border: 0; border-radius: 8px; color: #fff; background: var(--green); cursor: pointer; }
@keyframes loader { from { transform: translateX(0); } to { transform: translateX(125%); } }
@keyframes ball-turn { 50% { transform: rotate(180deg) scale(.92); } 100% { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

@media (max-width: 860px) {
  .detail-inner { padding-inline: 22px; }
  .info-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .move-data-grid { grid-template-columns: repeat(2,1fr); }
  .ability-item { grid-template-columns: minmax(130px,.55fr) 1fr; }
}

@media (max-width: 700px) {
  html { overflow-x: hidden; overflow-y: scroll; scrollbar-gutter: stable; }
  body { min-width: 0; overflow-x: hidden; overflow-y: visible; }
  .app-shell { height: auto; min-height: 100dvh; overflow: visible; }
  .topbar { position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: 9px; min-height: 64px; padding: 9px 12px; }
  .mobile-list-toggle { display: flex; align-items: center; gap: 4px; padding: 7px 8px; border-radius: 8px; background: var(--sidebar); font-size: var(--text-body); }
  .brand { flex: 1; gap: 4px; padding-left: 0; }
  .brand-title { font-size: var(--text-reading); }
  .header-version { min-height: 26px; margin-left: 0; padding-inline: 9px; font-size: var(--text-micro); }
  .brand-ball { width: 21px; height: 21px; }
  .brand-ball::after { inset: 5px; }
  .search-area { order: 5; flex-basis: 100%; width: 100%; max-width: none; margin: 0; }
  .search-result-list { max-height: min(416px,calc(100dvh - 170px)); }
  .search-results-heading span { display: none; }
  .search-result-row { min-height: 52px; padding-inline: 10px; }
  .search-result-types { gap: 3px; margin-left: 6px; }
  .search-result-types .type-badge { padding: 4px 5px; font-size: var(--text-micro); }
  .content-grid { display: block; height: auto; }
  .pokemon-index { position: fixed; z-index: 25; top: 117px; bottom: 0; left: 0; width: clamp(220px,52vw,270px); transform: translateX(-105%); border-right: 1px solid var(--line); box-shadow: 16px 20px 38px rgba(31,45,37,.2); transition: transform .2s ease; }
  .pokemon-index.mobile-open { transform: translateX(0); }
  .pokemon-detail { width: 100%; height: auto; overflow: visible; overscroll-behavior: auto; background: radial-gradient(circle 280px at 91% 80px,rgba(240,105,88,.12),transparent 70%),var(--paper); }
  .detail-inner { width: 100%; max-width: 100%; padding: 16px 15px 40px; }
  .detail-inner::before { top: -130px; right: -180px; width: 390px; height: 390px; }
  .detail-hero { grid-template-columns: minmax(0,1fr) 142px; min-height: 158px; }
  .hero-copy h1 { font-size: 36px; }
  .hero-image { grid-template-rows: 138px 29px; width: 142px; min-height: 167px; transform: translateY(-11px); }
  .hero-image > img { width: 138px; height: 138px; }
  .hero-image > img.pixel-sprite { width: 105px; height: 105px; }
  .detail-hero + .detail-tabs { margin-top: 5px; }
  .form-selector { margin-top: 12px; padding: 11px; }
  .form-selector-heading > small { max-width: 165px; }
  .form-option-list { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .form-applicability { grid-template-columns: 1fr; }
  .form-applicability > small { grid-column: 1; }
  .detail-tabs { gap: 15px; overflow-x: auto; padding-left: 9px; }
  .detail-tabs button { font-size: var(--text-body); }
  .detail-section { padding: 15px; }
  .info-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .flavor-entry-list { grid-template-columns: 1fr; }
  .presence-compact-list { grid-template-columns: 1fr; }
  .presence-all-status { margin: 12px -15px -15px; padding: 13px 15px 15px; }
  .presence-generation-grid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; }
  .matchup-groups { grid-template-columns: 1fr; gap: 14px; }
  .ability-item { grid-template-columns: 1fr; gap: 6px; }
  .move-toolbar { flex-direction: column; align-items: stretch; }
  .move-toolbar label { max-width: none; }
  .move-search-box input { font-size: var(--text-reading); }
  .move-toolbar > div { justify-content: flex-start; }
  .move-toolbar button { min-height: 34px; padding: 7px 10px; }
  .move-context { grid-template-columns: 1fr; }
  .move-table-head { display: none; }
  .move-row > summary { grid-template-columns: minmax(0,1fr) auto; grid-template-rows: auto auto; gap: 4px 9px; }
  .move-row .move-name { grid-column: 1; grid-row: 1; }
  .move-row .move-name b { font-size: var(--text-body); }
  .move-actions { display: flex; align-items: center; align-self: center; gap: 8px; grid-column: 2; grid-row: 1 / 3; }
  .move-actions .type-badge { grid-column: auto; justify-self: auto; }
  .move-secondary { display: flex; min-width: 0; align-items: baseline; gap: 6px; grid-column: 1; grid-row: 2; }
  .move-secondary .move-class, .move-secondary .move-learn { grid-column: auto; }
  .move-row .move-class { color: var(--muted-light); }
  .move-row .move-class::after { margin-left: 6px; content: '·'; }
  .move-row .move-power, .move-row .move-accuracy, .move-row .move-pp { display: none; }
  .move-technical { grid-template-columns: 1fr; }
  .evolution-path { justify-content: safe center; gap: 8px; overflow-x: auto; }
  .path-fragment { gap: 8px; }
  .path-fragment > button { grid-template-rows: 54px auto; min-width: 74px; }
  .path-fragment img { width: 54px; height: 54px; }
  .version-difference { position: static; display: inline-flex; margin: 0 0 5px 8px; }
  .evolution-rule.has-difference .rule-topline { padding-right: 0; }
  .rule-topline { display: block; }
  .rule-form-route img { width: 42px; height: 42px; }
  .rule-default, .rule-alternative { display: inline-flex; margin-top: 8px; }
  .application-block { grid-template-columns: 1fr; }
  .application-block > b { padding-top: 0; }
  .lifecycle-list > div { grid-template-columns: 1fr; }
  .lifecycle-list small { grid-column: 1; }
}

@media (max-width: 390px) {
  .brand-title { font-size: var(--text-reading); }
  .mobile-list-toggle span { display: none; }
  .detail-hero { grid-template-columns: minmax(0,1fr) 112px; }
  .hero-copy h1 { font-size: 31px; }
  .hero-image { grid-template-rows: 108px 29px; width: 112px; min-height: 137px; }
  .hero-image > img { width: 108px; height: 108px; }
  .form-selector-heading > small { display: none; }
  .form-option-list { grid-template-columns: 1fr; }
  .rule-form-route { grid-template-columns: 1fr; }
  .rule-form-route > i { transform: rotate(90deg); justify-self: center; }
  .rule-form-route > div:last-child { justify-content: flex-start; text-align: left; }
  .type-badge, .status-tag { padding: 5px 7px; font-size: var(--text-caption); }
  .presence-card-summary { grid-template-columns: 28px minmax(0,1fr) 12px; }
  .presence-card-summary .presence-status { display: none; }
  .presence-card-body { padding-left: 10px; }
  .related-empty { display: grid; gap: 3px; }
  .stat-row { grid-template-columns: 67px 34px minmax(80px,1fr); }
  .stat-row > em { display: none; }
  .requirements-list { grid-template-columns: 1fr 1fr; }
}
